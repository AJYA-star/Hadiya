<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5E1624">
    <title>My Orders - Hadiya</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@500;700&family=Nunito+Sans:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&family=Italiana&family=Gulzar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>

        .banner { margin-bottom: 16px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
        .order-id { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
        .shop-name { font-family: var(--serif); font-weight: 700; font-size: 1.7rem; color: var(--head); line-height: 1.1; }
        .service-name { color: var(--ink-2); margin: 4px 0 8px; font-weight: 700; }
        .meta { color: var(--muted); font-size: 0.88rem; margin: 3px 0; }
        .total { margin-top: 8px; font-family: var(--script); font-weight: 700; font-size: 1.9rem; color: var(--wine); text-align: right; }
        .actions { margin-top: 8px; text-align: right; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
        .cancel-btn { background: transparent; color: var(--wine); border: 1.5px solid var(--wine); padding: 8px 18px; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 700; }
        .cancel-btn:hover { background: var(--wine); color: var(--on-wine); }
        .cancel-btn:disabled { opacity: 0.5; }
        .review-box, .review-done { margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); }
        .review-title { font-family: var(--serif); font-weight: 700; font-size: 1.3rem; color: var(--head); }
        .stars { display: flex; gap: 2px; margin: 4px 0 8px; }
        .stars button { background: none; border: 0; padding: 0 2px; font-size: 2rem; line-height: 1.1; color: #B09A72; cursor: pointer; }
        .stars button.on { color: var(--lemon); }
        .stars-static { color: var(--lemon); font-size: 1.3rem; letter-spacing: 2px; }
        .review-box textarea { min-height: 64px; margin-bottom: 8px; }
        .review-err { color: var(--wine); font-weight: 700; font-size: 0.88rem; min-height: 1.2em; margin-bottom: 6px; }
        .review-text { margin-top: 4px; color: var(--ink-2); overflow-wrap: anywhere; }
        .no-orders { text-align: center; padding: 50px 10px; color: var(--muted); font-weight: 700; }
        .no-orders a { color: var(--wine); font-weight: 800; text-decoration: underline; }

    </style>
</head>
<body>
    <div class="awning"></div>
    <div class="wrap">
        <header class="topbar">
            <a href="index.html" class="brand">
                <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18"/><path d="M12 9c-1.5-3-5-3.5-5-1.5S10 9 12 9zM12 9c1.5-3 5-3.5 5-1.5S14 9 12 9z"/></svg></span>
                <span class="brand-name">Hadiya</span>
            </a>
            <nav class="nav" id="siteNav"></nav>
        </header>

        <div class="page-head">
            <div class="script">your table</div>
            <h1>My orders</h1>
            <p>Follow your gifts from pickup to delivery.</p>
        </div>

        <div style="max-width:800px; margin-top:18px">
            <div class="banner" id="placedBanner" hidden>🎉 Order placed! The shop will confirm it shortly.</div>
            <div class="notice warn unread-banner" id="unreadBanner" hidden></div>
            <div id="ordersList"><p class="loading">Loading your orders...</p></div>
        </div>
    </div>

    <div class="trees" aria-hidden="true"></div>
    <footer class="site-footer">
        <div class="wrap">
            <span class="brand-name">Hadiya</span>
            <span>Gift wrapping, picked up and delivered back.</span>
        </div>
    </footer>

    <script src="config.js"></script>
    <script>renderNav('my-orders.html');</script>
    <script>
        const list = document.getElementById('ordersList');

        if (new URLSearchParams(location.search).get('placed')) {
            document.getElementById('placedBanner').hidden = false;
        }

        function money(n) { return 'AED ' + Number(n || 0); }

        function starsText(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

        function reviewBlock(order) {
            if (order.status !== 'completed') return '';
            if (order.review) {
                return `<div class="review-done"><div class="review-title">Your rating</div>
                    <div class="stars-static">${starsText(order.review.rating)}</div>
                    ${order.review.comment ? `<div class="review-text" data-notr>${esc(order.review.comment)}</div>` : ''}</div>`;
            }
            return `<div class="review-box" data-order="${esc(order._id)}">
                <div class="review-title">How was it?</div>
                <div class="stars">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-star="${n}" aria-label="${n}">★</button>`).join('')}</div>
                <textarea maxlength="500" placeholder="Write a short comment (optional)"></textarea>
                <div class="review-err"></div>
                <button type="button" class="btn btn-sm" data-send-review>Send review</button>
            </div>`;
        }

        function wireReviews() {
            list.querySelectorAll('.review-box').forEach(box => {
                let rating = 0;
                const err = box.querySelector('.review-err');
                const paint = () => box.querySelectorAll('[data-star]').forEach(b => b.classList.toggle('on', Number(b.dataset.star) <= rating));
                box.querySelectorAll('[data-star]').forEach(b => b.addEventListener('click', () => { rating = Number(b.dataset.star); err.textContent = ''; paint(); }));
                const send = box.querySelector('[data-send-review]');
                send.addEventListener('click', async () => {
                    if (!rating) { err.textContent = 'Please choose a rating from 1 to 5 stars.'; return; }
                    send.disabled = true; err.textContent = '';
                    try {
                        await api('/orders/' + encodeURIComponent(box.dataset.order) + '/review', {
                            method: 'POST', body: { rating, comment: box.querySelector('textarea').value.trim() }
                        });
                        fetchOrders();
                    } catch (e) { err.textContent = e.message; send.disabled = false; }
                });
            });
        }

        function render(orders) {
            if (!orders.length) {
                list.innerHTML = '<div class="no-orders">No orders found yet. <a href="shops.html">Time to wrap some gifts!</a></div>';
                return;
            }

            list.innerHTML = orders.map(order => {
                const status = order.status;
                const label = ORDER_STATUS_LABELS[status] || status;
                const pickup = order.pickupDetails || {};
                const delivery = order.deliveryDetails || {};
                const pickupText = pickup.type === 'shop_pickup' ? 'Shop picks up from: ' + (pickup.address || '') : 'You drop off at the shop';
                const deliveryText = delivery.type === 'shop_delivery' ? 'Delivered to: ' + (delivery.address || '') : 'You collect from the shop';
                const date = order.createdAt ? new Date(order.createdAt).toLocaleString(LOC) : '';

                return `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-id">#${esc(order.orderNumber)}</span>
                        <span class="status status-${esc(status)}">${esc(label)}</span>
                    </div>
                    <div class="shop-name">${esc(order.shop ? shopName(order.shop) : 'Unknown Shop')}</div>
                    <div class="service-name">${esc(order.service ? order.service.name : '')}</div>
                    <div class="meta">📥 ${esc(pickupText)}</div>
                    <div class="meta">📤 ${esc(deliveryText)}</div>
                    ${date ? `<div class="meta">🕒 Placed ${esc(date)}</div>` : ''}
                    ${order.pricing && Number(order.pricing.deliveryFee) > 0 ? `<div class="meta">Service ${esc(money(order.pricing.servicePrice))} + delivery ${esc(money(order.pricing.deliveryFee))}</div>` : ''}
                    <div class="total">${esc(money(order.pricing && order.pricing.total))}</div>
                    ${reviewBlock(order)}
                    <div class="actions">
                        <a class="btn btn-sm" data-chat="${esc(order._id)}" href="chat.html?order=${encodeURIComponent(order._id)}">💬 Chat with the shop</a>
                        ${status === 'pending' ? `<button class="cancel-btn" data-id="${esc(order._id)}">Cancel order</button>` : ''}
                    </div>
                </div>`;
            }).join('');

            list.querySelectorAll('.cancel-btn').forEach(btn => btn.addEventListener('click', () => cancelOrder(btn)));
            wireReviews();
            if (typeof applyUnread === 'function') applyUnread();
        }

        async function cancelOrder(button) {
            if (!confirm('Cancel this order?')) return;
            button.disabled = true;
            try {
                await api('/orders/' + encodeURIComponent(button.dataset.id) + '/cancel', { method: 'PUT', body: {} });
                fetchOrders();
            } catch (err) {
                alert(err.message);
                button.disabled = false;
            }
        }

        async function fetchOrders() {
            if (!getToken()) {
                list.innerHTML = '<div class="no-orders">Please <a href="login.html?next=my-orders.html">log in</a> to see your orders.</div>';
                return;
            }
            try {
                const data = await api('/orders/my-orders');
                render(data.orders || []);
            } catch (err) {
                if (err.status === 401) {
                    list.innerHTML = '<div class="no-orders">Your session has expired. Please <a href="login.html?next=my-orders.html">log in</a> again.</div>';
                } else {
                    list.innerHTML = `<div class="no-orders">${esc(err.message)}</div>`;
                }
            }
        }

        // "You have new messages" bar at the top
        document.addEventListener('unread-updated', event => {
            const total = event.detail.total;
            const bar = document.getElementById('unreadBanner');
            bar.hidden = total === 0;
            bar.textContent = total === 1 ? '💬 You have 1 new message. Open the chat on the order below.'
                                          : '💬 You have ' + total + ' new messages. Open the chat on the orders below.';
        });

        fetchOrders();
    </script>
</body>
</html>
